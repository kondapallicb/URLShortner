spring:
  application:
    name: url-shortener-agentic

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080

app:
  operator:
    token: ${WORKFLOW_OPERATOR_TOKEN:}
    name: ${WORKFLOW_OPERATOR_NAME:operator}
  storage:
    directory: ${URL_STORAGE_DIRECTORY:./data}
  rate-limit:
    max-requests: 60
    window-seconds: 60
